services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maevelle_dev}
      POSTGRES_USER: ${POSTGRES_USER:-maevelle_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maevelle_dev_password}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-maevelle_test}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # Preload only; TASK-018 creates the extension through a migration.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - timezone=UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5434}:5432
    volumes:
      # PostgreSQL 18 persists at /var/lib/postgresql, not the legacy /data path.
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://maevelle_dev:maevelle_dev_password@postgres:5432/maevelle_dev
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_POOL_MAX: 10
      LOG_LEVEL: info
      BETTER_AUTH_SECRET: development-only-compose-secret-at-least-32-chars
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_URL: http://localhost:8080
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://localhost:3000,http://localhost:3001,http://127.0.0.1:8080}
      MEDIA_STORAGE_PATH: /app/var/media
      MEDIA_MAX_UPLOAD_BYTES: 10485760
      STOREFRONT_ORGANIZATION_CODE: ${STOREFRONT_ORGANIZATION_CODE:-maevelle}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/var/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://maevelle_dev:maevelle_dev_password@postgres:5432/maevelle_dev
      DATABASE_POOL_MAX: 10
      LOG_LEVEL: info
      WORKER_HEARTBEAT_INTERVAL_MS: 30000
      BETTER_AUTH_SECRET: development-only-compose-secret-at-least-32-chars
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: maevelle-bangladesh-api
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    command: ['node', 'packages/database/dist/src/migrate-cli.js']
    environment:
      DATABASE_URL: postgresql://maevelle_dev:maevelle_dev_password@postgres:5432/maevelle_dev
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-owner:
    image: maevelle-bangladesh-api
    command: ['node', 'apps/api/dist/src/bootstrap-owner.js']
    environment:
      DATABASE_URL: postgresql://maevelle_dev:maevelle_dev_password@postgres:5432/maevelle_dev
      DATABASE_POOL_MAX: 1
      BETTER_AUTH_SECRET: development-only-compose-secret-at-least-32-chars
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_URL: http://localhost:8080
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-owner@maevelle.local}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-Maevelle-dev-password-2026}
      BOOTSTRAP_ORGANIZATION_CODE: ${BOOTSTRAP_ORGANIZATION_CODE:-maevelle}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Maevelle Bangladesh}
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.admin
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/admin').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  storefront:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.storefront
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:8080}
      STOREFRONT_INTERNAL_API_URL: http://api:3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      api:
        condition: service_healthy
      bootstrap-owner:
        condition: service_completed_successfully
      admin:
        condition: service_healthy
      storefront:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CADDY_PORT:-8080}:80
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
