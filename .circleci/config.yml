version: 2.1

jobs:
  publish-staging:
    machine:
      image: ubuntu-2404:current
    resource_class: medium

    steps:
      - checkout

      - run:
          name: Build, test and publish commit-pinned staging images
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            bash scripts/ci-publish-staging-images.sh

workflows:
  staging-images:
    jobs:
      - publish-staging:
          filters:
            branches:
              only: main
