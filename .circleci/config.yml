version: 2.1

jobs:
  validate-checkout:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Validate Checkout candidate without publication
          no_output_timeout: 30m
          command: bash scripts/ci-checkout-readiness.sh

  publish-staging:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      MAEVELLE_PIPELINE_NUMBER: '<< pipeline.number >>'
      MAEVELLE_SOURCE_BRANCH: '<< pipeline.git.branch >>'

    steps:
      - checkout

      - run:
          name: Publish verified staging candidate (VPS rollout tracked separately)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            bash scripts/ci-publish-staging-images.sh

      - store_artifacts:
          path: artifacts/staging-releases

workflows:
  staging-images:
    jobs:
      - validate-checkout:
          filters:
            branches:
              only: main
      - publish-staging:
          requires:
            - validate-checkout
          filters:
            branches:
              only: main
